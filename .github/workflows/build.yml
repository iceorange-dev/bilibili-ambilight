name: Build

on:
  push:
    branches: [main]
    # Only version tags like v0.1.1. The tags of the original project (version-2.8) do not match.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      - name: Build and package
        run: |
          name="bilibili-ambilight-$(node -p "require('./package.json').version")"
          mkdir release

          npm run build
          (cd dist && zip -qr "../release/$name-chrome.zip" .)

          # Firefox only supports background.scripts, the rest of the build is the same
          node manifest-copy.js firefox
          (cd dist && zip -qr "../release/$name-firefox.zip" .)

          # The userscript is a single self-contained file
          npm run build:userscript
          cp bilibili-ambilight.user.js release/

          ls -l release

      - uses: actions/upload-artifact@v7
        with:
          name: bilibili-ambilight
          path: release/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bilibili-ambilight
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/bilibili-ambilight.user.js \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$(cat <<'EOF'
          ## 安裝

          **Chrome / Edge**：下載 `-chrome.zip` 並解壓縮，開啟 `chrome://extensions`，打開「開發人員模式」，點「載入未封裝項目」並選擇解壓縮後的資料夾。

          **Firefox**：下載 `-firefox.zip`，開啟 `about:debugging#/runtime/this-firefox`，點「載入暫用附加元件」並選擇 zip 檔。這個版本沒有經過 Mozilla 簽署，重新啟動 Firefox 後會被移除。
          EOF
          )"
